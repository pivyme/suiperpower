name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint skills
        run: pnpm lint:skills

      - name: Lint catalog
        run: pnpm lint:catalog

      - name: Preamble check
        run: pnpm preamble:check

      - name: Build
        run: pnpm build
