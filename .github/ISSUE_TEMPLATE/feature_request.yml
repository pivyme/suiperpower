name: Feature request
description: Propose a change to the CLI, website, or catalog.
title: "[feat] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        For a new skill, use the "Skill request" template instead. For roadmap-level ideas, use Discussions.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's painful or missing today? Be concrete.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the behavior look like? Commands, flags, UI, output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they don't fit.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
