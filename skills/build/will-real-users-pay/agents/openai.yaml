name: will-real-users-pay
version: 1
phase: build
description: |
  Run a cheap pricing experiment that produces a real signal from candidate
  users in two weeks or less, before the user claims "people will pay for
  this". Use when the user says "will users pay", "willingness to pay",
  "pricing experiment", "pricing test", "should I charge for this", "validate
  price", "validate pricing", "smoke test pricing", or "is anyone willing to
  pay".
prompt_path: ../SKILL.md
references:
  - ../references/experiment-formats.md
  - ../references/outreach-script-template.md
