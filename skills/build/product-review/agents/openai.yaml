name: product-review
version: 1
phase: build
description: |
  Walk the product as a first-time user would, from first paint through
  onboarding, empty states, error states, mobile, and time-to-first-value,
  and produce a prioritized roadmap of UX fixes. Use when the user says
  "product review", "UX review", "review my UX", "review my product", "review
  the onboarding", "first impressions", "user experience review", "how is the
  UX", or "audit my UX".
prompt_path: ../SKILL.md
references:
  - ../references/impact-effort-matrix.md
  - ../references/ttfv-benchmarks.md
