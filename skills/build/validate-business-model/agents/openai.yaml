name: validate-business-model
version: 1
phase: build
description: |
  Force the user to answer five concrete questions about who pays, how much,
  and why, and refuse to claim a business model exists if they cannot. Use
  when the user says "validate my business model", "who pays for this", "how
  do I make money", "monetization", "pricing", "business model", or "is this
  profitable".
prompt_path: ../SKILL.md
references:
  - ../references/payer-types.md
  - ../references/cost-checklist.md
