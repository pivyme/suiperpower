name: retention-loop
version: 1
phase: build
description: |
  Force the user to articulate a concrete retention loop, day 1 / day 2 / day
  7 / day 30 anchors, in a single paragraph. Use when the user says
  "retention loop", "what brings users back", "day 1 day 7 retention",
  "engagement loop", "user retention", "stickiness", or "why will users come
  back".
prompt_path: ../SKILL.md
references:
  - ../references/loop-anti-patterns.md
  - ../references/anchor-examples.md
