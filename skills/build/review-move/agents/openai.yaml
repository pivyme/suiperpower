name: review-move
version: 1
phase: build
description: |
  Run an in-house P0 to P3 security review on a Sui Move package and surface
  OpenZeppelin migration suggestions. Use when the user says "review my Move
  code for security", "find bugs in my Move package", "P0 P1 P2 P3 walk",
  "internal Move audit", "where can OpenZeppelin replace my code", "Move
  review", or "self-audit before OtterSec".
  Reads .suiperpower/build-context.md if present.
prompt_path: ../SKILL.md
references:
  - ../references/p0-p3-rubric.md
  - ../references/oz-migration-candidates.md
  - ../references/review-output-template.md
knowledge:
  - skills/data/guides/security-checklist.md
  - skills/data/sui-knowledge/sponsor-docs/openzeppelin-sui.md
