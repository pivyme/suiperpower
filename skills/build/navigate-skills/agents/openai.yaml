name: navigate-skills
version: 1
phase: build
description: |
  Browse and pick the right Suiperpower skill for the user's current goal, by
  reading the skills catalog. Use when the user says "what skills do I have",
  "list suiperpower skills", "which skill should I use for X", "show me
  available skills", "what can suiperpower do", "find a skill for", "navigate
  skills", or "I do not know which skill fits".
prompt_path: ../SKILL.md
references:
  - ../references/phase-glossary.md
  - ../references/router-precedence.md
knowledge:
  - cli/data/sui-skills.json
  - skills/SKILL_ROUTER.md
