name: submit-to-sui-overflow
version: 1
phase: ship
description: |
  Drive the Sui Overflow submission end to end on deepsurge.xyz, captures the
  package id from deploy-context.md, validates the 1280x1280 logo and media
  set, drafts the form copy, generates the demo video script, and runs the
  day-of preflight before the user clicks submit. Use when the user says
  "submit to Sui Overflow", "submit hackathon", "submit my project", "Sui
  Overflow submission", "fill the deepsurge form", "prepare submission", or
  "submit to overflow".
prompt_path: ../SKILL.md
references:
  - ../references/video-script-template.md
  - ../references/form-copy-template.md
