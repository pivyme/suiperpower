name: pick-my-sui-track
version: 1
phase: ship
description: |
  Map the project to a single Sui Overflow track based on integration depth,
  scoring each sponsor (Walrus, DeepBook, OpenZeppelin, OtterSec, Scallop) on
  a 0-3 scale and refusing to recommend any track that does not score 3 on a
  load-bearing flow. Use when the user says "which track", "which Overflow
  track", "which sponsor track", "pick my track", "what track should I submit
  to", "Sui Overflow track", or "track recommendation".
prompt_path: ../SKILL.md
references:
  - ../references/scoring-rubric.md
  - ../references/load-bearing-tests.md
