name: walrus-storage
version: 1
phase: build
description: |
  Integrate Walrus decentralized blob storage into a Sui project, store and retrieve files,
  and commit blob ids on chain. Use when the user says "store files on Walrus",
  "integrate Walrus blob storage", "upload an image to Walrus", "host my NFT media on Walrus",
  "store user uploads on Sui", "use Walrus for my dataset", or "decentralized storage on Sui".
  Reads .suiperpower/build-context.md if present.
prompt_path: ../SKILL.md
references:
  - ../references/walrus-quickstart.md
  - ../references/walrus-pitfalls.md
  - ../references/walrus-move-commit.md
knowledge:
