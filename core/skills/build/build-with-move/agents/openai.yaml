  - ../references/common-move-pitfalls.md
  - ../references/package-manifest-example.md
knowledge:
  - skills/data/sui-knowledge/03-move-and-objects.md
  - skills/data/sui-knowledge/sponsor-docs/openzeppelin-sui.md
