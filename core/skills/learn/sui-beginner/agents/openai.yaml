name: sui-beginner
version: 1
phase: learn
description: |
  Teach Sui from scratch in plain language, with explicit framing for builders
  coming from EVM or Solana so they map known concepts to Sui equivalents
  instead of being told "it is just different". Use when the user says "teach
  me Sui", "I am new to Sui", "explain Sui to me", "Sui basics", "Sui for
  beginners", "I am coming from EVM", "I am coming from Solana", "what is
  different on Sui", "how does Sui work", or "Sui starter".
prompt_path: ../SKILL.md
references:
  - ../references/evm-to-sui.md
  - ../references/solana-to-sui.md
